name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ vars.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ vars.APP_DIR }}
            git pull origin main
            docker build -t icrc-contract-generator:latest .
            docker stop icrc-contract-generator || true
            docker rm icrc-contract-generator || true
            docker run -d --name icrc-contract-generator \
              --restart unless-stopped \
              -p 5000:5000 \
              icrc-contract-generator:latest
