name: Deploy to Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One deploy at a time; queue rather than cancel so a run that already
    # started updating the host is never interrupted half-way.
    concurrency:
      group: deploy-lightsail
      cancel-in-progress: false
    steps:
      # Moved off EC2+SSM onto a Lightsail instance (see git history for the
      # migration). SSM was originally chosen here because direct SSH from
      # GitHub-hosted runners to the old EC2 host mysteriously timed out at
      # the TCP level; that was re-tested against this Lightsail host as part
      # of the migration and reaches it fine, so plain SSH is back - it also
      # means no AWS IAM role/OIDC is needed for deploys at all any more.
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          cat > /tmp/deploy.sh <<'SCRIPT'
          set -e
          cd ${{ vars.APP_DIR }}
          git pull origin main
          mkdir -p data output

          # Login credentials for the site, and the Flask session signing
          # key - kept out of the repo, only ever written to this file on
          # the host. chmod so only root/owner can read it.
          cat > .env <<'ENVEOF'
          APP_USERNAME=${{ secrets.APP_USERNAME }}
          APP_PASSWORD=${{ secrets.APP_PASSWORD }}
          SECRET_KEY=${{ secrets.APP_SECRET_KEY }}
          ENVEOF
          chmod 600 .env
          if [ ! -f data/project_management.db ] && docker inspect icrc-contract-generator >/dev/null 2>&1; then
            docker cp icrc-contract-generator:/app/data/. ./data/ || true
          fi
          sudo chown -R 1000:1000 data output

          # One-time migration off the old raw `docker run` deployment
          # (replaced by docker compose + Caddy for HTTPS) - stop/remove
          # it so compose can bind host port 80/443 without a conflict.
          docker stop icrc-contract-generator 2>/dev/null || true
          docker rm icrc-contract-generator 2>/dev/null || true

          docker compose up -d --build
          docker image prune -f

          # Fail the job if the app doesn't come up, so a red check means
          # "not deployed" rather than "deployed and broken".
          cid=$(docker compose ps -q web)
          if [ -z "$cid" ]; then
            echo "web container is not running" >&2
            docker compose logs --tail 50 web >&2 || true
            exit 1
          fi
          healthy=""
          for _ in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo unknown)
            if [ "$status" = "healthy" ]; then
              healthy=1
              break
            fi
            sleep 5
          done
          if [ -z "$healthy" ]; then
            echo "web did not become healthy (last status: ${status:-unknown})" >&2
            docker compose logs --tail 50 web >&2 || true
            exit 1
          fi
          echo "web is healthy"

          # Caddy has no HEALTHCHECK of its own - just confirm it's
          # actually running (not exited on a config/bind error).
          sleep 3
          caddy_cid=$(docker compose ps -q caddy)
          if [ -z "$caddy_cid" ] || [ "$(docker inspect -f '{{.State.Running}}' "$caddy_cid")" != "true" ]; then
            echo "caddy container is not running" >&2
            docker compose logs --tail 50 caddy >&2 || true
            exit 1
          fi
          echo "caddy is running"
          SCRIPT

          scp -i ~/.ssh/deploy_key /tmp/deploy.sh "ubuntu@${{ secrets.DEPLOY_HOST }}:/tmp/deploy.sh"
          ssh -i ~/.ssh/deploy_key "ubuntu@${{ secrets.DEPLOY_HOST }}" 'bash /tmp/deploy.sh'
