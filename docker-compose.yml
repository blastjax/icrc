services:
  web:
    # image: pulled from GHCR on the Lightsail host (see
    # .github/workflows/deploy-ec2.yml); the build: block below is only
    # exercised by a local `docker compose up --build`.
    image: ${WEB_IMAGE:-icrc-web}:latest
    build: .
    restart: always
    # icrc-web is the name the Caddyfile proxies to. It's unique, unlike
    # `web`, so the same site block also works on the shared edge network
    # (docker-compose.edge.yml).
    networks:
      default:
        aliases: [icrc-web]
    # No host port publish in production - only reachable through Caddy
    # (see below). Local dev can still hit it directly with:
    #   docker compose run --service-ports web
    # APP_USERNAME/APP_PASSWORD/SECRET_KEY/DATABASE_URL come from a .env file
    # the deploy workflow writes from GitHub secrets - not committed to the
    # repo. Using substitution (not env_file:) so this also works with no
    # .env present at all, which is the case for local dev (login is then
    # skipped entirely - see app.py).
    environment:
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./output:/app/output
    depends_on:
      - redis
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  redis:
    image: redis:7-alpine
    restart: always
    # Cache only, no persistence needed - a restart just means the next
    # page load re-warms it from Postgres.
  caddy:
    restart: always
    image: caddy:2-alpine
    # Sole public entry point: terminates TLS (auto-provisions and renews
    # the Let's Encrypt cert for the domain in the Caddyfile). Only for a host
    # running this stack on its own: on the shared Lightsail host the deploy
    # adds docker-compose.edge.yml, which switches this off in favour of the
    # edge proxy fronting every site there.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
